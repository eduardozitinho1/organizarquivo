[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "organizarquivo"
version = "0.2.0"
description = "Organize files automatically into folders based on their extensions."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Eduardo" }
]
keywords = [
    "file-organizer",
    "file-management",
    "automation",
    "cli",
    "organizer",
    "undo",
    "productivity"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]
dependencies = [
    "tomli>=2.0; python_version < '3.11'"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
publish = [
    "build>=1",
    "twine>=5",
]

[project.scripts]
organizarquivo = "organizarquivo.cli:main"

[project.urls]
Homepage = "https://github.com/eduardozitinho1/organizarquivo"
Repository = "https://github.com/eduardozitinho1/organizarquivo"
Issues = "https://github.com/eduardozitinho1/organizarquivo/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
